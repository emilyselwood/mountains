<!DOCTYPE html>
<html>
<head>
    <title>Mountains</title>
    <script>
      const svgNS = "http://www.w3.org/2000/svg";

      let width = 800;
      let height = 600;

      function defineLine(mid, upper, lower, step) {
        let result = [];
        let prev_y = mid;
        for (let x = 0; x < width; x+=step) {
          let direction = -step;
          if (prev_y >= upper) {
            direction = -step;
          } else if (prev_y <= lower) {
            direction = step;
          } else if (Math.random() > 0.5) {
            direction = step
          }

          let y = prev_y+direction;
          result.push([x, y]);
          prev_y = y;
        }
        return result;
      }

      function draw(parentEl, points, colour, id) {
        let pathStr = points
          .map(function (point, index) {
            if (index == 0) {
              return "M" + point[0] + " " + point[1];
            }
            return "L" + point[0] + " " + point[1];
          })
          .join(" ");

        pathStr += 'z';

        let path = document.createElementNS(svgNS, "path");
        path.setAttribute("id", "line-" + id);
        path.setAttribute("stroke-width", "1");
        path.setAttribute("stroke", "none");
        path.setAttribute("fill", colour);
        path.setAttribute("d", pathStr);
        parentEl.appendChild(path);
      }

      function drawLine(mid, upper, lower, colour, step, id) {
        const points = defineLine(mid, upper, lower, step);
        points.push([width, height]);
        points.push([0, height]);

        const svgEl = document.getElementById("image_root");
        draw(svgEl, points, colour, id);

        return points;
      }

      function find_y(line, x) {
        for (let i = 0; i < line.length; i++) {
          if (line[i][0] > x) {
            return line[i-1][1];
          }
        }
        return null;
      }

      // generate random points of yellow light across the section
      function lights(upper, lower, id, parent) {
        let group = document.createElementNS(svgNS, "g");

        const num_lights = Math.floor(Math.random() * 25 + Math.random() * 25);
        for (let i = 0; i < num_lights; i++) {
          const x = Math.floor(Math.random() * width);

          const start = find_y(lower, x);
          const range = find_y(upper, x) - start;
          const y = Math.floor(Math.random() * range) + start;

          const circleEl = document.createElementNS(svgNS, "circle");
          circleEl.setAttribute("id", "dot-" + id + "-" + i);
          circleEl.setAttribute("fill", "yellow");
          circleEl.setAttribute("cx", x);
          circleEl.setAttribute("cy", y);
          circleEl.setAttribute("r", "0.5px");

          group.appendChild(circleEl);
        }

        parent.appendChild(group);
      }

      function drawMountains() {
        const layers = [
          ["#000066", 2],
          ["#000044", 2],
          ["#000033", 2],
          ["#000022", 1],
          ["#000005", 1],
        ];

        const embellishments = [
          lights,
        ];

        const svgEl = document.getElementById("image_root");

        // init svg el to be the same size as the window as 100% height does odd things.
        width =  window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
        height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;

        svgEl.width = width;
        svgEl.height = height;
        svgEl.setAttribute("viewBox", "0 0 "+width+" "+height);

        // draw a white box first
        draw(svgEl, [[0,0], [width, 0], [width, height], [0, height]], "#FFFFFF", "sky");

        const step = height / (layers.length+1);

        let current = step;
        let previous = 0;
        let prev_points = [];
        for (let i = 0; i < layers.length; i++) {
          const current_points = drawLine(current, current + step, current - step, layers[i][0], layers[i][1], i);

          if (prev_points.length > 0 && Math.random() > 0.9) {
            const embellishment = embellishments[Math.floor(Math.random() * embellishments.length)];
            embellishment(prev_points, current_points, i, svgEl);
          }
          prev_points = current_points;
          current += step;
        }

      }

    </script>
</head>
<body onload="drawMountains();" style="margin:0; padding:0; background-color: black;">
    <svg
        id="image_root"
        version="1.1"
        viewBox="0 0 800 600"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:svg="http://www.w3.org/2000/svg"
        stroke="none"
        fill="none"
        stroke-width="1px"
        stroke-opacity="1"
        fill-opacity="1"
        stroke-linejoin="round"
    >
    </svg>
</body>
</html>
